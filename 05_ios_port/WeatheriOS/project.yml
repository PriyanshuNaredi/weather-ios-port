# XcodeGen spec — the macOS/Xcode build entry point for the WeatheriOS port.
#
# The Linux pipeline used SwiftPM + xtool (see xtool.yml); xtool only exists on
# Linux, so on macOS we generate a real .xcodeproj from this spec:
#
#   brew install xcodegen && xcodegen generate --spec project.yml
#   xcodebuild -project WeatheriOS.xcodeproj -scheme WeatheriOS \
#              -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' build
#
# The .xcodeproj is generated output (gitignored); this file is the source of truth.
name: WeatheriOS

options:
  bundleIdPrefix: dev.kiankonrad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # The sources are Swift 6 `swift-tools-version:6.0` clean except for two
    # strict-concurrency diagnostics (DiagLog mach_task_self_,
    # WeatherMapView inFlight) that the Linux toolchain never reported.
    # Swift 5 language mode matches what the Linux build actually exercised.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CLANG_ENABLE_MODULES: YES

targets:
  WeatheriOS:
    type: application
    platform: iOS
    sources:
      # All Swift sources (Package.swift/xtool.yml are not part of the app target).
      - path: Sources/WeatheriOS
        excludes:
          - "legal"
      # `legal/` is read at runtime via Bundle.main.url(forResource:subdirectory:"legal"),
      # i.e. SwiftPM's `.copy("legal")` semantics — a folder reference, not a
      # flattened resource copy.
      - path: Sources/WeatheriOS/legal
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Weather
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "6"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AndroidManifest.xml declares INTERNET + ACCESS_COARSE/FINE_LOCATION;
        # iOS maps the location pair onto these usage strings.
        NSLocationWhenInUseUsageDescription:
          Weather uses your location to show conditions for where you are.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kiankonrad.weather
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        # AppIcon.appiconset is rendered from the APK's own vector by
        # 07_tools/make-app-icon.swift; this empty value used to suppress it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  WeatheriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WeatheriOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kiankonrad.weather.uitests
        TEST_TARGET_NAME: WeatheriOS
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  WeatheriOS:
    build:
      targets:
        WeatheriOS: all
        WeatheriOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeatheriOSUITests

